name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install pytest httpx ruff

      - name: Ingest and validate dataset
        run: python src/ingest.py

      - name: Lint with ruff
        run: ruff check src tests

      - name: Run tests
        run: pytest -v

  # Runs in parallel with `test`. Retrains and applies the quality gate with
  # no threshold overrides. The model it saves stays on this throwaway runner;
  # production only ever serves the committed models/model.pkl.
  pipeline:
    name: Train and quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Ingest and validate dataset
        run: python src/ingest.py

      - name: Run pipeline (quality gate enforced)
        run: python src/pipeline.py

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, pipeline]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t telco-churn-api:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name api telco-churn-api:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8000/health
          docker stop api